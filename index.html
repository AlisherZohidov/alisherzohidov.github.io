<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quivy — Arrow Puzzle</title>
<meta name="description" content="Quivy: a relaxing arrow logic puzzle for Android. Tap an arrow, set it free and clear the board.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--ink:#111111;--muted:#5E6170;--tile:#111111;--tile-ink:#FFFFFF;--accent:#FF4D5E;--soft:#F3F4F7}
@media (prefers-color-scheme:dark){:root{--bg:#0E0E10;--ink:#F2F2F5;--muted:#A0A2AE;--tile:#F2F2F5;--tile-ink:#111111;--soft:#1A1A1F}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;text-align:center}
.mark{width:96px;height:96px;margin-bottom:18px}
h1{font-size:clamp(52px,14vw,88px);font-weight:900;letter-spacing:-.03em;line-height:.95;margin:0}
.sub{font-size:22px;font-weight:800;color:var(--accent);margin:8px 0 18px}
p{max-width:420px;margin:0 auto 28px;color:var(--muted);font-weight:600;line-height:1.55;font-size:17px}
.links{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
a.btn{display:inline-block;text-decoration:none;font-weight:800;color:var(--ink);background:var(--soft);padding:13px 22px;border-radius:999px}
a.btn:hover,a.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
footer{margin-top:40px;color:var(--muted);font-size:14px;font-weight:600}
</style>
</head>
<body>
<svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
  <rect x="4" y="9" width="16" height="16" rx="4.5" fill="var(--tile)"/><rect x="4" y="28" width="16" height="16" rx="4.5" fill="var(--tile)"/><rect x="23" y="28" width="16" height="16" rx="4.5" fill="var(--tile)"/>
  <rect x="28" y="4" width="16" height="16" rx="4.5" fill="var(--accent)"/>
  <path d="M32 12h8m-3.2-3.2L40 12l-3.2 3.2" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M12 13.5v7m-3-4 3-3 3 3M15 36.5H8m3-3-3 3 3 3M31 32.5v7m-3-3 3 3 3-3" stroke="var(--tile-ink)" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
<h1>Quivy</h1>
<div class="sub">Arrow Puzzle</div>
<p>Tap an arrow and watch it fly! Find the right order, set every arrow free and clear the board. A relaxing logic puzzle for Android.</p>
<div class="links">
  <a class="btn" href="/quivy-privacy/">Privacy Policy</a>
  <a class="btn" href="mailto:quivy.games@gmail.com">Contact</a>
</div>
<footer>© 2026 Quivy</footer>
</body>
</html>
